<style>
:root{--bg:#f4f6f5;--cd:#fff;--tx:#14201a;--mu:#6b7a72;--ac:#0f9d58;--bd:#e2e8e4;--h:#0f9d58;--d:#d99a1c;--a:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--cd:#18211c;--tx:#e8f0ea;--mu:#8fa196;--ac:#2fd283;--bd:#26332b;--h:#2fd283;--d:#e5b04a;--a:#ec6a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}

</style></head><body><div id="app"></div>
<script>
const $a=document.getElementById('app');
let KEY=localStorage.getItem('apikey')||'',DATE=new Date().toISOString().slice(0,10),TAB=0,TOL=0.10,CUR=null,D={};
const CODE={203:'T1',39:'E0',140:'SP1',135:'I1',78:'D1',61:'F1',88:'N1',94:'P1',144:'B1',71:'BRA',40:'E1',179:'SC0',197:'G1',136:'I2',79:'D2',218:'AUT',207:'SWZ',119:'DNK',103:'NOR',113:'SWE',253:'USA',128:'ARG',62:'F2',141:'SP2'},SHOW=[203,39,140,135,78,61,2,3,848,88,94,144,71,204,40,179,197,136,79,218,207,119,103,113,253,128,62,141,89],
  NEWC=['BRA','AUT','SWZ','DNK','NOR','SWE','USA','ARG'],CAL=['BRA','NOR','SWE','USA','ARG'];
const ALLC=['E0','SP1','I1','D1','F1','T1','N1','P1','B1','SC0','G1','AUT','SWZ','DNK','NOR','SWE'];
const SEA=['2223','2324','2425','2526','2627'],HC={};
const FLAGC={62:'fr',141:'es',89:'nl',203:'tr',204:'tr',39:'ENG',40:'ENG',140:'es',135:'it',136:'it',78:'de',79:'de',61:'fr',88:'nl',94:'pt',144:'be',71:'br',179:'SCT',197:'gr',218:'at',207:'ch',119:'dk',103:'no',113:'se',253:'us',128:'ar',2:'eu',3:'eu',848:'eu'};
const flagOf=id=>{const c=FLAGC[id];if(!c)return '\u{1F30D}';
  if(c=='ENG')return '\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}';
  if(c=='SCT')return '\u{1F3F4}\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F}';
  return String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt(0)))};
const limg=(u,z)=>u?`<img class="tl"${z?` style="width:${z}px;height:${z}px"`:''} src="${String(u).replace(/"/g,'')}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=s=>parseFloat(String(s).replace('%',''))||0;
const dayKey=()=>new Date().toISOString().slice(0,10);
function used(){try{const u=JSON.parse(localStorage.getItem('used')||'{}');return u.d==dayKey()?u.n:0}catch(e){return 0}}
function bump(){try{localStorage.setItem('used',JSON.stringify({d:dayKey(),n:used()+1}))}catch(e){}}
function prune(){try{Object.keys(localStorage).filter(k=>k.startsWith('c:')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function api(p,q,ttl=6*36e5,force=false){
  const ck='c:'+p+'?'+new URLSearchParams(q);
  if(!force){try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<c.ttl)return c.v}catch(e){}}
  const r=await fetch('https://v3.football.api-sports.io/'+p+'?'+new URLSearchParams(q),{headers:{'x-apisports-key':KEY}});bump();
  const j=await r.json();const e=Object.values(j.errors||{})[0];if(e)throw new Error(e);
  const v=j.response||[],rec=JSON.stringify({t:Date.now(),ttl:v.length?ttl:Math.min(ttl,20*6e4),v});
  try{localStorage.setItem(ck,rec)}catch(x){prune();try{localStorage.setItem(ck,rec)}catch(y){}}
  return v}
function bar(h,d,a){const t=(h+d+a)||1;return `<div class="bar"><i style="width:${h/t*100}%;background:var(--h)"></i><i style="width:${d/t*100}%;background:var(--d)"></i><i style="flex:1;background:var(--a)"></i></div>`}
function setKey(){const v=document.getElementById('k').value.trim();if(!v)return;KEY=v;localStorage.setItem('apikey',v);localStorage.removeItem('nofb');home()}
let SQ='',LF='',LGN=[];
const norm1=t=>t.replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function renderList(){const el=document.getElementById('l');if(!el||!D.list)return;
  const all=D.list,lgs=[...new Set(all.map(f=>f.league.name))].sort();LGN=lgs;if(LF&&!lgs.includes(LF))LF='';
  const q=norm1(SQ),fl=all.filter(f=>(!LF||f.league.name==LF)&&(!MYF||isMyMatch(f))&&(!q||norm1(f.teams.home.name+' '+f.teams.away.name).includes(q))),g={},nmy=Object.keys(ld('myteams')).length;
  fl.forEach(f=>(g[f.league.name]??=[]).push(f));el.className='';
  el.innerHTML=(lgs.length>1||nmy?`<div class="tabs" style="margin:10px 0 0"><button class="${LF||MYF?'':'on'}" onclick="LF='';MYF=false;renderList()">Tümü</button>${nmy?`<button class="${MYF?'on':''}" onclick="MYF=!MYF;renderList()">⭐ Takımlarım (${nmy})</button>`:''}${lgs.map((n,i)=>`<button class="${n==LF?'on':''}" onclick="LF=LGN[${i}];renderList()">${flagOf((all.find(f=>f.league.name==n)||{league:{}}).league.id)} ${esc(n)}</button>`).join('')}</div>`:'')+
    (Object.keys(g).sort().map(n=>`<div class="lg">${flagOf(g[n][0].league.id)} ${esc(n)}</div>`+g[n].map(f=>{
      const sc=f.goals.home!=null?`<b>${f.goals.home}<br>${f.goals.away}</b>`:'';
      return `<div class="c m" onclick="openM(${f.fixture.id})"><span class="t">${tmf(f)}${liveTag(f)}</span><span class="n">${limg(f.teams.home.logo)}${esc(f.teams.home.name)}<br>${limg(f.teams.away.logo)}${esc(f.teams.away.name)}</span>${sc}</div>`}).join('')).join('')||`<div class="c" style="margin-top:10px">${all.length?'Eşleşen maç yok.':'Bu tarihte listelenen lig maçı yok.'}</div>`)}
const NM=[['England',40,/^Championship$/i],['Scotland',179,/^Premiership$/i],['Greece',197,/^Super League( 1)?$/i],['Italy',136,/^Serie B$/i],['Germany',79,/^2\. Bundesliga$/i],['Austria',218,/^Bundesliga$/i],['Switzerland',207,/^Super League$/i],['Denmark',119,/^Superliga$/i],['Norway',103,/^Eliteserien$/i],['Sweden',113,/^Allsvenskan$/i],['USA',253,/^(Major League Soccer|MLS)$/i],['Argentina',128,/^Liga Profesional/i],['France',62,/^Ligue 2$/i],['Spain',141,/^Segunda Divisi[oó]n$/i],['Netherlands',89,/^Eerste Divisie$/i]];
function fixLeague(f){const l=f.league,e=NM.find(x=>x[0]==l.country&&x[2].test(l.name));
  if(e){l.id=e[1];return f}
  if(NM.some(x=>x[1]==l.id)){l.id=-1}   // aynı kimlikte başka bir lig geldiyse listeye alma
  return f}
async function home(){
  CUR=null;
  if(!KEY){$a.innerHTML=`<h1>Maç Analiz</h1><div class="c"><h3>API-Football anahtarı</h3><input type="password" id="k" placeholder="Anahtarı yapıştır"><button class="bt" onclick="setKey()">Kaydet</button><p class="mu">Ücretsiz anahtar: dashboard.api-football.com (günde 100 istek). Anahtar sadece bu tarayıcıda saklanır.</p></div>`;return}
  $a.innerHTML=`<h1>Günün Maçları</h1><input type="date" id="dt" value="${DATE}" onchange="DATE=this.value;home()"><input type="text" id="sq" placeholder="Takım ara…" value="${esc(SQ)}" oninput="SQ=this.value;renderList()" style="margin-top:8px"><div class="mu" id="u" style="margin-top:6px">Bugün kullanılan istek: ~${used()}/100</div><button class="chip" onclick="refreshScores()">🔄 Skorları yenile (1 istek)</button><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="bt" style="margin:0;flex:1 1 40%" onclick="karne()">📊 Karne</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="ligStat()">📈 Lig</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="defter()">🧾 Defter</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="settings()">💾 Yedek</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="kupon()">🎫 Kupon (${ldA('kupon').length})</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="hayal()">⚔️ Hayali maç</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="kasa()">💰 Kasa</button></div>${bkHint()}${favHTML()}<div id="rec"></div><div class="c"><button class="bt" style="margin:0" onclick="scanOdds()">🔎 Toplu oran taraması</button><div class="mu" style="margin-top:6px">Günün başlamamış maçlarının en iyi oranlarını çekip modelle kıyaslar. Her yeni maç 1 istek harcar (önbellekte olanlar harcamaz), başlamadan önce onay istenir.</div><div id="scan"></div></div><div id="l" class="mu" style="margin-top:12px">Yükleniyor…</div><p class="mu"><a href="#" onclick="localStorage.removeItem('apikey');KEY='';home();return false" style="color:var(--mu)">Anahtarı değiştir</a></p>`;
  try{
    const all=(await api('fixtures',{date:DATE,timezone:'Europe/Istanbul'},18e5,FORCE)).map(fixLeague).filter(f=>SHOW.includes(f.league.id)).sort((a,b)=>a.fixture.date.localeCompare(b.fixture.date));
    D.list=all;FORCE=false;settle(all);{const u=document.getElementById('u');if(u)u.textContent='Bugün kullanılan istek: ~'+used()+'/100'}renderList();
    recs(all);
  }catch(e){document.getElementById('l').outerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function toggleFav(){const F=ld('fav'),id=CUR.fixture.id;if(F[id])delete F[id];else F[id]={f:CUR};sv('fav',F);draw()}
function saveNote(v){const N=ld('notes'),id=CUR.fixture.id;if(v.trim())N[id]=v;else delete N[id];sv('notes',N)}
function openM(id){
  CUR=(D.list||[]).find(f=>f.fixture.id==id)||ld('fav')[id]?.f;TAB=9;
  D.m={loading:0,err:null,odds:null,hist:[],pred:null,inj:[],lu:[],probable:false,done:{}};
  need(9);histLoad()}
function setTab(i){TAB=i;D.m.err=null;need(i)}
async function histLoad(){const m=D.m,lid=CUR.league.id;if(m.hstart)return;m.hstart=1;m.hist=await loadHist(lid);m.hdone=true;draw();try{m.md=await getModel(lid)}catch(e){}draw()}
async function need(i){
  const m=D.m,f=CUR,id=f.fixture.id;
  const run=async(k,fn)=>{if(m.done[k])return;m.done[k]=1;m.loading++;draw();try{await fn()}catch(e){m.err=e.message}m.loading--;draw()};
  if(i==4)run('pred',async()=>{m.pred=(await api('predictions',{fixture:id},12*36e5))[0]||null});
  if(i==5)run('lu',async()=>{m.lu=await api('fixtures/lineups',{fixture:id},6*36e5);
    if(m.lu.length<2&&!localStorage.getItem('nofb')){m.probable=true;const out=[];
      try{for(const tm of [f.teams.home,f.teams.away]){
        const to=new Date(DATE),fr=new Date(DATE);fr.setDate(fr.getDate()-30);const iso=d=>d.toISOString().slice(0,10);
        const ss=to.getMonth()>=6?to.getFullYear():to.getFullYear()-1;
        const fx=(await api('fixtures',{team:tm.id,from:iso(fr),to:iso(to),season:String(ss)},12*36e5)).filter(z=>z.fixture.status.short=='FT').sort((a,b)=>b.fixture.date.localeCompare(a.fixture.date));
        if(fx[0]){const l=await api('fixtures/lineups',{fixture:fx[0].fixture.id},48*36e5);const x=l.find(z=>z.team.id==tm.id);if(x)out.push(x)}}}
      catch(e){try{localStorage.setItem('nofb','1')}catch(x){}}
      m.lu=out}});
  if(i==6)run('inj',async()=>{m.inj=dedupeInj(await api('injuries',{fixture:id},3*36e5))});
  if(i==7)run('odds',async()=>{
    const o=await api('odds',{fixture:id},3*36e5,m.forceOdds);m.forceOdds=false;
    const bms=o?.[0]?.bookmakers||[],bet=(b,k)=>b.bets.find(x=>x.id==k),num=(b,k,v)=>{const q=bet(b,k),z=q&&q.values.find(x=>x.value==v);return z?parseFloat(z.odd):NaN};
    const bm=bms.find(b=>bet(b,1))||bms[0];
    const g=k=>(bm&&bet(bm,k))||bms.map(b=>bet(b,k)).find(Boolean);
    const w=g(1),h7=g(7),o5=g(5),b8=g(8),b12=g(12);
    if(h7){m.htft={};h7.values.forEach(v=>m.htft[v.value]=parseFloat(v.odd))}
    if(o5){const u=n=>parseFloat(o5.values.find(x=>x.value==n)?.odd);m.ou=[u('Over 2.5'),u('Under 2.5')];m.ouAll={};
      o5.values.forEach(v=>{const q=/^(Over|Under) (\d+(\.\d+)?)$/.exec(v.value);if(q)(m.ouAll[q[2]]??={})[q[1]]=parseFloat(v.odd)})}
    if(b8){const u=n=>parseFloat(b8.values.find(x=>x.value==n)?.odd);m.btsO={Yes:u('Yes'),No:u('No')}}
    if(b12){const u=n=>parseFloat(b12.values.find(x=>x.value==n)?.odd);m.dc={'1X':u('Home/Draw'),'12':u('Home/Away'),'X2':u('Draw/Away')}}
    if(w){const v=n=>parseFloat(w.values.find(x=>x.value==n)?.odd);m.odds=[v('Home'),v('Draw'),v('Away')]}
    m.bk=bms.map(b=>({n:b.name,H:num(b,1,'Home'),D:num(b,1,'Draw'),A:num(b,1,'Away')})).filter(x=>!isNaN(x.H));
    snapOdds(id,m)});
  draw()}
function draw(){
  const f=CUR,m=D.m;if(!f)return;
  const T=['Tahmin','Form','H2H','Tablo','Analiz','Kadro','Eksikler','Oran','Korner·Kart','Asistan','Simülasyon'];
  const ORD=[9,0,10,1,2,3,8,4,5,6,7];
  const fv=!!ld('fav')[f.fixture.id];
  $a.innerHTML=`<div class="row"><button class="bk" onclick="home()">‹ Maçlar</button><button class="bk" style="font-size:22px" onclick="toggleFav()">${fv?'★':'☆'}</button></div><h1><span style="cursor:pointer;border-bottom:1px dotted var(--mu)" onclick="tpMatch(0)">${limg(f.teams.home.logo,26)}${esc(f.teams.home.name)}</span> – <span style="cursor:pointer;border-bottom:1px dotted var(--mu)" onclick="tpMatch(1)">${limg(f.teams.away.logo,26)}${esc(f.teams.away.name)}</span></h1><div class="mu">${flagOf(f.league.id)} ${esc(f.league.name)}</div><div class="tabs">${ORD.map(i=>`<button class="${i==TAB?'on':''}" onclick="setTab(${i})">${T[i]}</button>`).join('')}</div>${m.loading?'<div class="mu">Yükleniyor…</div>':''}${m.err?`<div class="err">${esc(m.err)}</div>`:''}`+[tTahmin,tForm,tH2H,tTablo,tAnaliz,tKadro,tEksik,tOran,tKK,tAsistan,tSim][TAB](f,m)+mineCard(f)+`<div class="c"><h3>Notum</h3><textarea rows="3" placeholder="Bu maç için notların…" oninput="saveNote(this.value)">${esc(ld('notes')[f.fixture.id]||'')}</textarea><button class="bt" style="background:var(--d)" onclick="defterFor()">🧾 Deftere ekle</button> <button class="bt" style="background:var(--mu)" onclick="calOne()">📅 Takvime ekle</button> <button class="bt" style="background:var(--mu)" onclick="sharePred()">📤 Paylaş</button></div>`+`<p class="mu">Bugün kullanılan istek: ~${used()}/100 · sekmeler açıldıkça veri çekilir, tekrar açınca önbellekten gelir.</p>`;
}
const NAMES={form:'Form',att:'Hücum',def:'Savunma',h2h:'Karşılaşma geçmişi',goals:'Gol',total:'Genel'};
function tAnaliz(f,m){const p=m.pred;if(!p)return m.loading?'':'<div class="c">Bu maç için analiz verisi yok.</div>';
  {const adv=String(p.predictions&&p.predictions.advice||''),q0=p.predictions&&p.predictions.percent;
   if(/no predictions/i.test(adv)||(q0&&q0.home==q0.draw&&q0.draw==q0.away))return '<div class="c"><h3>API bu maç için tahmin üretmemiş</h3><div class="mu">API-Football tahminleri genellikle maça yakın saatlerde üretir. Kupa maçlarında ve farklı liglerden takımların karşılaşmasında çoğu zaman hiç üretmez. Ekrandaki 33% gibi değerler yer tutucudur, tahmin değildir.</div><div style="margin-top:8px">Bu maç için <b>Asistan</b> ve <b>Tahmin</b> sekmelerindeki kendi modelimizi kullanabilirsin. Bu sekmeler API isteği harcamaz.</div></div>'}
  let s='';const q=p.predictions.percent;
  if(q)s+=`<div class="c"><h3>Tahmin olasılıkları</h3>${bar(pc(q.home),pc(q.draw),pc(q.away))}<div class="row"><span>1 ${q.home}</span><span>X ${q.draw}</span><span>2 ${q.away}</span></div></div>`;
  if(p.predictions.advice)s+=`<div class="c"><h3>Öneri</h3>${esc(p.predictions.advice)}</div>`;
  if(p.comparison)s+=`<div class="c"><h3>Karşılaştırma</h3>`+Object.keys(NAMES).filter(k=>p.comparison[k]).map(k=>{const v=p.comparison[k];return `<div class="row mu" style="margin-top:8px"><span>${v.home}</span><span>${NAMES[k]}</span><span>${v.away}</span></div>${bar(pc(v.home),0,pc(v.away))}`}).join('')+'</div>';
  return s}
function tKadro(f,m){

function kasaRun(){const {bank,n,stake,pct,pctv,odds,p}=KA,R=rng(KA.seed),N=4000,pp=Math.min(.99,Math.max(.01,p/100)),nn=Math.max(1,Math.min(1000,Math.round(n)));
  const marks=Array.from({length:21},(_,i)=>Math.round(nn*i/20)),vals=marks.map(()=>new Float64Array(N)),fin=new Float64Array(N);let ruin=0,prof=0;
  for(let s=0;s<N;s++){let b=bank,dead=false,mi=0;while(mi<marks.length&&marks[mi]==0){vals[mi][s]=b;mi++}
    for(let i=1;i<=nn;i++){if(!dead){if(b<(pct?bank*.02:stake)){dead=true}else{const st=pct?b*pctv/100:stake;b+=R()<pp?st*(odds-1):-st}}
      while(mi<marks.length&&marks[mi]==i){vals[mi][s]=b;mi++}}

  <p class="mu">Bahisler birbirinden bağımsız ve her birinin tutma ihtimali aynı varsayılır. Gerçekte oranlar ve tutma ihtimalleri bahisten bahise değişir. Bu bir tahmin değil, risk gösterimidir. Bahis para kaybettirebilir.</p>`}
// ---- Toplu oran taraması ----
const isCached=(p,q)=>{try{const c=JSON.parse(localStorage.getItem('c:'+p+'?'+new URLSearchParams(q))||'null');return !!(c&&Date.now()-c.t<c.ttl)}catch(e){return false}};
function scanParse(o){const bms=(o&&o[0]&&o[0].bookmakers)||[],best={H:[0,''],D:[0,''],A:[0,''],O:[0,''],U:[0,'']};
  for(const b of bms){const w=b.bets.find(x=>x.id==1),g=b.bets.find(x=>x.id==5),v=(q,n)=>{const z=q&&q.values.find(x=>x.value==n);return z?parseFloat(z.odd):0};
    [['H',v(w,'Home')],['D',v(w,'Draw')],['A',v(w,'Away')],['O',v(g,'Over 2.5')],['U',v(g,'Under 2.5')]].forEach(([k,x])=>{if(x>best[k][0])best[k]=[x,b.name]})}
  return best}
async function scanOdds(){const el=document.getElementById('scan');if(!el)return;
  const items=(REC||[]).filter(x=>x.f.fixture.status.short=='NS'&&x.md).slice(0,25);
  if(!items.length){el.innerHTML='<div class="mu" style="margin-top:8px">Önce günün maçlarının modelleri hazırlanmalı (öneri listesi yüklenince tekrar dene). Başlamamış maç yoksa tarama yapılmaz.</div>';return}
  const need=items.filter(x=>!isCached('odds',{fixture:x.f.fixture.id})).length;
  if(need&&!confirm(`${items.length} maç taranacak; bunların ${need} tanesi yeni istek harcayacak (şu ana kadar ~${used()}/100 kullanıldı). Devam edilsin mi?`))return;
  const out=[];let k=0;
  for(const x of items){el.innerHTML=`<div class="mu" style="margin-top:8px">Taranıyor… ${++k}/${items.length}</div>`;
    try{const o=await api('odds',{fixture:x.f.fixture.id},3*36e5),b=scanParse(o),cf=calFn(x.md),r=x.r,pr={H:cf(r.H),D:cf(r.D),A:cf(r.A),O:cf(r.o25),U:1-cf(r.o25)};
      for(const [key,lab] of [['H','1'],['D','X'],['A','2'],['O','2.5 Üst'],['U','2.5 Alt']]){const od=b[key];if(od[0]>1)out.push({f:x.f,lab,p:pr[key],od:od[0],bk:od[1],edge:pr[key]*od[0]-1})}
    }catch(e){el.innerHTML=`<div class="err">${esc(e.message)}</div>`;return}}
  const top=out.filter(x=>x.edge>0).sort((a,c)=>c.edge-a.edge).slice(0,12);
  el.innerHTML=`<div class="mu" style="margin-top:8px">${items.length} maç tarandı. Model, bahis şirketlerinin en iyi oranından daha yüksek ihtimal veriyorsa aşağıda listelenir.</div>`+
    (top.length?top.map(x=>`<div class="li" style="cursor:pointer" onclick="openM(${x.f.fixture.id})"><span>${limg(x.f.teams.home.logo)}${esc(x.f.teams.home.name)} – ${limg(x.f.teams.away.logo)}${esc(x.f.teams.away.name)}<div class="mu"><b>${x.lab}</b> · model %${Math.round(x.p*100)} · oran ${x.od.toFixed(2)} (${esc(x.bk)})</div></span><b style="text-align:right">${x.edge>=0?'+':'−'}%${Math.abs(x.edge*100).toFixed(0)}</b></div>`).join(''):'<div class="mu" style="margin-top:6px">Modelin piyasadan daha yüksek ihtimal verdiği seçim bulunamadı.</div>')+
    '<div class="mu" style="margin-top:8px">Uyarı: Büyük farklar çoğunlukla fırsattan değil, modelin bilmediği bilgiden (sakatlık, kadro, motivasyon) kaynaklanır. Bahis şirketleri bu bilgiyi fiyata yansıtır. Listeyi “bakılacak maçlar” olarak kullan, “alınacak seçim” olarak değil. Garanti değildir.</div>'}
function tOran(f,m){const o=m.odds;if(!o||o.some(isNaN))return `<div class="c mu">${m.loading?'Yükleniyor…':'Bu maç için oran bulunamadı (oranlar genelde maçtan birkaç gün önce açılır).'}</div>`;
  const d=p=>o.reduce((s,v,i)=>s+Math.abs(p.o[i]-v)/v,0);
  const S=m.hist.filter(p=>o.every((v,i)=>Math.abs(p.o[i]-v)/v<=TOL)).sort((a,b)=>d(a)-d(b)),n=S.length,c=k=>S.filter(x=>x.r==k).length;
  const inv=o.map(x=>1/x),tot=inv.reduce((a,b)=>a+b,0);
  let s=`<div class="c"><h3>Güncel oranlar</h3>1: ${o[0].toFixed(2)} &nbsp; X: ${o[1].toFixed(2)} &nbsp; 2: ${o[2].toFixed(2)}<div class="mu" style="margin-top:10px">Benzerlik toleransı: ±%<span id="tv">${Math.round(TOL*100)}</span></div><input type="range" min="0.03" max="0.25" step="0.01" value="${TOL}" onchange="TOL=+this.value;draw()" oninput="document.getElementById('tv').textContent=Math.round(this.value*100)"></div>`;
  s+=extra(m)+oddsMore(f,m);
  if(!m.hist.length)return s+(m.hdone?`<div class="c">Geçmiş veri dosyaları bulunamadı. GitHub’da Actions → Veri güncelle → Run workflow ile indir, 1 dakika sonra sayfayı yenile.<br><button class="bt" onclick="retryH()">Tekrar dene</button></div>`:`<div class="c mu">Geçmiş maçlar indiriliyor, bu 20-30 saniye sürebilir…</div>`);
  if(!n)return s+'<div class="c">Bu aralıkta benzer maç yok. Toleransı artır.</div>';
  const P=x=>Math.round(x/n*100);
  s+=`<div class="c"><h3>${n} benzer maç</h3>${bar(c('H'),c('D'),c('A'))}<div>Gerçekleşen: 1 %${P(c('H'))} · X %${P(c('D'))} · 2 %${P(c('A'))}</div><div class="mu" style="margin-top:6px">Oranın ima ettiği: 1 %${Math.round(inv[0]/tot*100)} · X %${Math.round(inv[1]/tot*100)} · 2 %${Math.round(inv[2]/tot*100)}</div></div>`;
  return s+`<div class="c">`+S.slice(0,40).map(p=>`<div class="li"><span>${esc(p.h)} – ${esc(p.a)}<div class="mu">${p.o.map(x=>x.toFixed(2)).join(' / ')} · ${p.s.slice(0,2)}/${p.s.slice(2)}</div></span><b>${p.hg}-${p.ag}</b></div>`).join('')+'</div>'}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

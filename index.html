<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f6f5;--cd:#fff;--tx:#14201a;--mu:#6b7a72;--ac:#0f9d58;--bd:#e2e8e4;--h:#0f9d58;--d:#d99a1c;--a:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--cd:#18211c;--tx:#e8f0ea;--mu:#8fa196;--ac:#2fd283;--bd:#26332b;--h:#2fd283;--d:#e5b04a;--a:#ec6a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 8px}h3{margin:0 0 8px;font-size:15px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}.m{cursor:pointer;display:flex;gap:10px;align-items:center}
.m .t{width:44px;color:var(--mu);font-size:13px}.m .n{flex:1}.m b{text-align:right}
.lg{font-size:12px;color:var(--mu);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
button,input{font:inherit}
.bk{background:none;border:0;color:var(--ac);padding:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.tabs button{flex:1 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=date],input[type=password],input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--ac)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0;gap:2px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pt{background:rgba(15,157,88,.16);border-radius:8px;padding:8px;margin:6px 0;text-align:center;font-size:14px}
.tag{font-size:11px;color:#fff;border-radius:6px;padding:2px 8px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.dot{display:inline-block;width:20px;height:20px;border-radius:5px;font:700 11px/20px sans-serif;text-align:center;color:#fff;margin-right:3px;font-style:normal}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
.tb{display:grid;grid-template-columns:26px 1fr 26px 26px 26px 26px 34px 30px;gap:2px;font-size:13px;padding:5px 4px;border-radius:6px;align-items:center}.tb.hd{color:var(--mu);font-size:11px}.tb.hl{background:rgba(15,157,88,.18);font-weight:600}.tb span:not(:nth-child(2)){text-align:center}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:4px 10px;margin:6px 6px 0 0;font-size:12px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
.err{color:var(--a);font-size:13px;margin:8px 0}
.bt{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const $a=document.getElementById('app');
let KEY=localStorage.getItem('apikey')||'',DATE=new Date().toISOString().slice(0,10),TAB=0,TOL=0.10,CUR=null,D={};
const CODE={203:'T1',39:'E0',140:'SP1',135:'I1',78:'D1',61:'F1',88:'N1',94:'P1',144:'B1',71:'BRA',40:'E1',179:'SC0',197:'G1',136:'I2',79:'D2',218:'AUT',207:'SWZ',119:'DNK',103:'NOR',113:'SWE',253:'USA',128:'ARG'},SHOW=[203,39,140,135,78,61,2,3,848,88,94,144,71,204,40,179,197,136,79,218,207,119,103,113,253,128],
  NEWC=['BRA','AUT','SWZ','DNK','NOR','SWE','USA','ARG'],CAL=['BRA','NOR','SWE','USA','ARG'];
const ALLC=['E0','SP1','I1','D1','F1','T1','N1','P1','B1','SC0','G1','AUT','SWZ','DNK','NOR','SWE'];
const SEA=['2223','2324','2425','2526','2627'],HC={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=s=>parseFloat(String(s).replace('%',''))||0;
const dayKey=()=>new Date().toISOString().slice(0,10);
function used(){try{const u=JSON.parse(localStorage.getItem('used')||'{}');return u.d==dayKey()?u.n:0}catch(e){return 0}}
function bump(){try{localStorage.setItem('used',JSON.stringify({d:dayKey(),n:used()+1}))}catch(e){}}
function prune(){try{Object.keys(localStorage).filter(k=>k.startsWith('c:')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function api(p,q,ttl=6*36e5){
  const ck='c:'+p+'?'+new URLSearchParams(q);
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<c.ttl)return c.v}catch(e){}
  const r=await fetch('https://v3.football.api-sports.io/'+p+'?'+new URLSearchParams(q),{headers:{'x-apisports-key':KEY}});bump();
  const j=await r.json();const e=Object.values(j.errors||{})[0];if(e)throw new Error(e);
  const v=j.response||[],rec=JSON.stringify({t:Date.now(),ttl:v.length?ttl:Math.min(ttl,20*6e4),v});
  try{localStorage.setItem(ck,rec)}catch(x){prune();try{localStorage.setItem(ck,rec)}catch(y){}}
  return v}
function bar(h,d,a){const t=(h+d+a)||1;return `<div class="bar"><i style="width:${h/t*100}%;background:var(--h)"></i><i style="width:${d/t*100}%;background:var(--d)"></i><i style="flex:1;background:var(--a)"></i></div>`}
function setKey(){const v=document.getElementById('k').value.trim();if(!v)return;KEY=v;localStorage.setItem('apikey',v);localStorage.removeItem('nofb');home()}
let SQ='',LF='',LGN=[];
const norm1=t=>t.replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function renderList(){const el=document.getElementById('l');if(!el||!D.list)return;
  const all=D.list,lgs=[...new Set(all.map(f=>f.league.name))].sort();LGN=lgs;if(LF&&!lgs.includes(LF))LF='';
  const q=norm1(SQ),fl=all.filter(f=>(!LF||f.league.name==LF)&&(!q||norm1(f.teams.home.name+' '+f.teams.away.name).includes(q))),g={};
  fl.forEach(f=>(g[f.league.name]??=[]).push(f));el.className='';
  el.innerHTML=(lgs.length>1?`<div class="tabs" style="margin:10px 0 0"><button class="${LF?'':'on'}" onclick="LF='';renderList()">Tümü</button>${lgs.map((n,i)=>`<button class="${n==LF?'on':''}" onclick="LF=LGN[${i}];renderList()">${esc(n)}</button>`).join('')}</div>`:'')+
    (Object.keys(g).sort().map(n=>`<div class="lg">${esc(n)}</div>`+g[n].map(f=>{
      const sc=f.goals.home!=null?`<b>${f.goals.home}<br>${f.goals.away}</b>`:'';
      return `<div class="c m" onclick="openM(${f.fixture.id})"><span class="t">${tmf(f)}</span><span class="n">${esc(f.teams.home.name)}<br>${esc(f.teams.away.name)}</span>${sc}</div>`}).join('')).join('')||`<div class="c" style="margin-top:10px">${all.length?'Eşleşen maç yok.':'Bu tarihte listelenen lig maçı yok.'}</div>`)}
const NM=[['England',40,/^Championship$/i],['Scotland',179,/^Premiership$/i],['Greece',197,/^Super League( 1)?$/i],['Italy',136,/^Serie B$/i],['Germany',79,/^2\. Bundesliga$/i],['Austria',218,/^Bundesliga$/i],['Switzerland',207,/^Super League$/i],['Denmark',119,/^Superliga$/i],['Norway',103,/^Eliteserien$/i],['Sweden',113,/^Allsvenskan$/i],['USA',253,/^(Major League Soccer|MLS)$/i],['Argentina',128,/^Liga Profesional/i]];
function fixLeague(f){const l=f.league,e=NM.find(x=>x[0]==l.country&&x[2].test(l.name));
  if(e){l.id=e[1];return f}
  if(NM.some(x=>x[1]==l.id)){l.id=-1}   // aynı kimlikte başka bir lig geldiyse listeye alma
  return f}
async function home(){
  CUR=null;
  if(!KEY){$a.innerHTML=`<h1>Maç Analiz</h1><div class="c"><h3>API-Football anahtarı</h3><input type="password" id="k" placeholder="Anahtarı yapıştır"><button class="bt" onclick="setKey()">Kaydet</button><p class="mu">Ücretsiz anahtar: dashboard.api-football.com (günde 100 istek). Anahtar sadece bu tarayıcıda saklanır.</p></div>`;return}
  $a.innerHTML=`<h1>Günün Maçları</h1><input type="date" id="dt" value="${DATE}" onchange="DATE=this.value;home()"><input type="text" id="sq" placeholder="Takım ara…" value="${esc(SQ)}" oninput="SQ=this.value;renderList()" style="margin-top:8px"><div class="mu" id="u" style="margin-top:6px">Bugün kullanılan istek: ~${used()}/100</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="bt" style="margin:0;flex:1 1 40%" onclick="karne()">📊 Karne</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="ligStat()">📈 Lig</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="defter()">🧾 Defter</button><button class="bt" style="margin:0;flex:1 1 40%" onclick="settings()">💾 Yedek</button></div>${bkHint()}${favHTML()}<div id="rec"></div><div id="l" class="mu" style="margin-top:12px">Yükleniyor…</div><p class="mu"><a href="#" onclick="localStorage.removeItem('apikey');KEY='';home();return false" style="color:var(--mu)">Anahtarı değiştir</a></p>`;
  try{
    const all=(await api('fixtures',{date:DATE,timezone:'Europe/Istanbul'},18e5)).map(fixLeague).filter(f=>SHOW.includes(f.league.id)).sort((a,b)=>a.fixture.date.localeCompare(b.fixture.date));
    D.list=all;settle(all);{const u=document.getElementById('u');if(u)u.textContent='Bugün kullanılan istek: ~'+used()+'/100'}renderList();
    recs(all);
  }catch(e){document.getElementById('l').outerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function toggleFav(){const F=ld('fav'),id=CUR.fixture.id;if(F[id])delete F[id];else F[id]={f:CUR};sv('fav',F);draw()}
function saveNote(v){const N=ld('notes'),id=CUR.fixture.id;if(v.trim())N[id]=v;else delete N[id];sv('notes',N)}
function openM(id){
  CUR=(D.list||[]).find(f=>f.fixture.id==id)||ld('fav')[id]?.f;TAB=9;
  D.m={loading:0,err:null,odds:null,hist:[],pred:null,inj:[],lu:[],probable:false,done:{}};
  need(9);histLoad()}
function setTab(i){TAB=i;D.m.err=null;need(i)}
async function histLoad(){const m=D.m,lid=CUR.league.id;if(m.hstart)return;m.hstart=1;m.hist=await loadHist(lid);m.hdone=true;draw();try{m.md=await getModel(lid)}catch(e){}draw()}
async function need(i){
  const m=D.m,f=CUR,id=f.fixture.id;
  const run=async(k,fn)=>{if(m.done[k])return;m.done[k]=1;m.loading++;draw();try{await fn()}catch(e){m.err=e.message}m.loading--;draw()};
  if(i==4)run('pred',async()=>{m.pred=(await api('predictions',{fixture:id},12*36e5))[0]||null});
  if(i==5)run('lu',async()=>{m.lu=await api('fixtures/lineups',{fixture:id},6*36e5);
    if(m.lu.length<2&&!localStorage.getItem('nofb')){m.probable=true;const out=[];
      try{for(const tm of [f.teams.home,f.teams.away]){
        const to=new Date(DATE),fr=new Date(DATE);fr.setDate(fr.getDate()-30);const iso=d=>d.toISOString().slice(0,10);
        const ss=to.getMonth()>=6?to.getFullYear():to.getFullYear()-1;
        const fx=(await api('fixtures',{team:tm.id,from:iso(fr),to:iso(to),season:String(ss)},12*36e5)).filter(z=>z.fixture.status.short=='FT').sort((a,b)=>b.fixture.date.localeCompare(a.fixture.date));
        if(fx[0]){const l=await api('fixtures/lineups',{fixture:fx[0].fixture.id},48*36e5);const x=l.find(z=>z.team.id==tm.id);if(x)out.push(x)}}}
      catch(e){try{localStorage.setItem('nofb','1')}catch(x){}}
      m.lu=out}});
  if(i==6)run('inj',async()=>{m.inj=await api('injuries',{fixture:id},3*36e5)});
  if(i==7)run('odds',async()=>{
    const o=await api('odds',{fixture:id},3*36e5);
    const bms=o?.[0]?.bookmakers||[];const bm=bms.find(b=>b.bets.some(x=>x.id==1))||bms[0];
    const g=k=>bm?.bets.find(b=>b.id==k)||bms.flatMap(b=>b.bets).find(b=>b.id==k);
    const w=g(1),h7=g(7),o5=g(5);
    if(h7){m.htft={};h7.values.forEach(v=>m.htft[v.value]=parseFloat(v.odd))}
    if(o5){const u=n=>parseFloat(o5.values.find(x=>x.value==n)?.odd);m.ou=[u('Over 2.5'),u('Under 2.5')]}
    if(w){const v=n=>parseFloat(w.values.find(x=>x.value==n)?.odd);m.odds=[v('Home'),v('Draw'),v('Away')]}});
  draw()}
function draw(){
  const f=CUR,m=D.m;if(!f)return;
  const T=['Tahmin','Form','H2H','Tablo','Analiz','Kadro','Eksikler','Oran','Korner·Kart','Asistan'];
  const ORD=[9,0,1,2,3,8,4,5,6,7];
  const fv=!!ld('fav')[f.fixture.id];
  $a.innerHTML=`<div class="row"><button class="bk" onclick="home()">‹ Maçlar</button><button class="bk" style="font-size:22px" onclick="toggleFav()">${fv?'★':'☆'}</button></div><h1><span style="cursor:pointer;border-bottom:1px dotted var(--mu)" onclick="tpMatch(0)">${esc(f.teams.home.name)}</span> – <span style="cursor:pointer;border-bottom:1px dotted var(--mu)" onclick="tpMatch(1)">${esc(f.teams.away.name)}</span></h1><div class="mu">${esc(f.league.name)}</div><div class="tabs">${ORD.map(i=>`<button class="${i==TAB?'on':''}" onclick="setTab(${i})">${T[i]}</button>`).join('')}</div>${m.loading?'<div class="mu">Yükleniyor…</div>':''}${m.err?`<div class="err">${esc(m.err)}</div>`:''}`+[tTahmin,tForm,tH2H,tTablo,tAnaliz,tKadro,tEksik,tOran,tKK,tAsistan][TAB](f,m)+`<div class="c"><h3>Notum</h3><textarea rows="3" placeholder="Bu maç için notların…" oninput="saveNote(this.value)">${esc(ld('notes')[f.fixture.id]||'')}</textarea><button class="bt" style="background:var(--d)" onclick="defterFor()">🧾 Deftere ekle</button> <button class="bt" style="background:var(--mu)" onclick="calOne()">📅 Takvime ekle</button></div>`+`<p class="mu">Bugün kullanılan istek: ~${used()}/100 · sekmeler açıldıkça veri çekilir, tekrar açınca önbellekten gelir.</p>`;
}
const NAMES={form:'Form',att:'Hücum',def:'Savunma',h2h:'Karşılaşma geçmişi',goals:'Gol',total:'Genel'};
function tAnaliz(f,m){const p=m.pred;if(!p)return m.loading?'':'<div class="c">Bu maç için analiz verisi yok.</div>';
  let s='';const q=p.predictions.percent;
  if(q)s+=`<div class="c"><h3>Tahmin olasılıkları</h3>${bar(pc(q.home),pc(q.draw),pc(q.away))}<div class="row"><span>1 ${q.home}</span><span>X ${q.draw}</span><span>2 ${q.away}</span></div></div>`;
  if(p.predictions.advice)s+=`<div class="c"><h3>Öneri</h3>${esc(p.predictions.advice)}</div>`;
  if(p.comparison)s+=`<div class="c"><h3>Karşılaştırma</h3>`+Object.keys(NAMES).filter(k=>p.comparison[k]).map(k=>{const v=p.comparison[k];return `<div class="row mu" style="margin-top:8px"><span>${v.home}</span><span>${NAMES[k]}</span><span>${v.away}</span></div>${bar(pc(v.home),0,pc(v.away))}`}).join('')+'</div>';
  return s}
function tKadro(f,m){
  let s=m.probable&&m.lu.length?'<p class="mu">Kadrolar henüz açıklanmadı. Gösterilen, takımın son maçındaki ilk 11’dir (muhtemel).</p>':'';
  s+=m.lu.map(l=>`<div class="c"><h3>${esc(l.team.name)} ${l.formation?'· '+l.formation:''}</h3>`+['G','D','M','F'].map(p=>{const a=l.startXI.filter(x=>x.player.pos==p);return a.length?`<div class="pt">${a.map(x=>esc(x.player.name)).join(' · ')}</div>`:''}).join('')+'</div>').join('');
  return s||(m.loading?'':'<div class="c">Kadro henüz açıklanmadı. Genelde maçtan yaklaşık bir saat önce açıklanır.</div>')}
function kind(i){const r=(i.player.reason||'').toLowerCase();if(r.includes('suspen')||r.includes('card'))return['Cezalı','var(--d)'];if(i.player.type=='Questionable')return['Şüpheli','#6a7fd6'];return['Sakat','var(--a)']}
function tEksik(f,m){return [f.teams.home,f.teams.away].map(t=>{const l=m.inj.filter(i=>i.team.id==t.id);
  return `<div class="c"><h3>${esc(t.name)}</h3>`+(l.length?l.map(i=>{const[k,c]=kind(i);return `<div class="li"><span>${esc(i.player.name)}<div class="mu">${esc(i.player.reason||'')}</div></span><span class="tag" style="background:${c}">${k}</span></div>`}).join(''):'<span class="mu">Kayıtlı eksik yok</span>')+'</div>'}).join('')}
// Geçmiş oran verisi: data/ klasörü (GitHub Actions football-data.co.uk'den indirir)
async function getCSV(f){try{const r=await fetch(f);if(r.ok){const t=await r.text();if(t.includes('Home'))return t}}catch(e){}return ''}
function parse(t){const L=t.replace(/\r/g,'').split('\n');if(L.length<2)return[];const h=L[0].replace('\uFEFF','').split(',');const ix=n=>h.indexOf(n);
  const idt=ix('Date'),ihh=ix('HTHG'),iha=ix('HTAG'),ihc=ix('HC'),iac=ix('AC'),ihy=ix('HY'),iay=ix('AY');const nn=(i,c)=>{const v=i>=0?parseInt(c[i]):NaN;return isNaN(v)?null:v};const pdt=x=>{const m=(x||'').match(/(\d+)\/(\d+)\/(\d+)/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()};
  const [ih,ia,ig,ig2]=['HomeTeam','AwayTeam','FTHG','FTAG'].map(ix);if([ih,ia,ig,ig2].some(x=>x<0))return[];
  const S=[['B365H','B365D','B365A'],['AvgH','AvgD','AvgA'],['PSH','PSD','PSA']].map(s=>s.map(ix)).filter(s=>s.every(x=>x>=0));const out=[];
  for(const ln of L.slice(1)){const c=ln.split(',');const hg=parseInt(c[ig]),ag=parseInt(c[ig2]);if(isNaN(hg)||isNaN(ag))continue;
    let o=null;for(const s of S){const v=s.map(i=>parseFloat(c[i]));if(v.every(x=>x>0)){o=v;break}}if(!o)continue;
    out.push({h:c[ih],a:c[ia],hg,ag,r:hg>ag?'H':hg<ag?'A':'D',o,d:pdt(c[idt]),hh:(x=>isNaN(x)?null:x)(ihh>=0?parseInt(c[ihh]):NaN),ha:(x=>isNaN(x)?null:x)(iha>=0?parseInt(c[iha]):NaN),hc:nn(ihc,c),ac:nn(iac,c),hy:nn(ihy,c),ay:nn(iay,c)})}return out}
const pdate=x=>{const m=(x||'').match(/(\d+)\/(\d+)\/(\d+)/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()};
const normS=x=>{const m=x.match(/(\d{4})\D+(\d{4})/);return m?m[1].slice(2)+m[2].slice(2):x.trim().slice(0,4)};
function parseNew(t){
  const L=t.replace(/\r/g,'').split('\n');if(L.length<2)return[];const h=L[0].replace('\uFEFF','').split(',');const ix=n=>h.indexOf(n);
  const [iS,iD,iH,iA,iG,iG2]=['Season','Date','Home','Away','HG','AG'].map(ix);if([iS,iD,iH,iA,iG,iG2].some(x=>x<0))return[];
  const sets=[['AvgCH','AvgCD','AvgCA'],['PSCH','PSCD','PSCA'],['AvgH','AvgD','AvgA'],['PH','PD','PA']].map(s=>s.map(ix)).filter(s=>s.every(x=>x>=0));const out=[];
  for(const ln of L.slice(1)){const c=ln.split(',');const hg=parseInt(c[iG]),ag=parseInt(c[iG2]);if(isNaN(hg)||isNaN(ag))continue;
    let o=null;for(const s of sets){const v=s.map(i=>parseFloat(c[i]));if(v.every(x=>x>0)){o=v;break}}if(!o)continue;
    out.push({h:c[iH],a:c[iA],hg,ag,r:hg>ag?'H':hg<ag?'A':'D',o,d:pdate(c[iD]),hh:null,ha:null,s:normS(String(c[iS]))})}
  return out}

  return `<svg viewBox="0 0 270 130" style="width:100%;max-width:340px;margin-top:6px"><line x1="30" y1="${Y(0)}" x2="262" y2="${Y(0)}" style="stroke:var(--mu);stroke-dasharray:4 3"/><polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" style="fill:none;stroke:${fin>=0?'var(--h)':'var(--a)'};stroke-width:2"/>${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5" style="fill:${fin>=0?'var(--h)':'var(--a)'}"/>`).join('')}<text x="28" y="${Y(mx)+3}" text-anchor="end" ${tx}>${Math.round(mx)}</text><text x="28" y="${Y(mn)+3}" text-anchor="end" ${tx}>${Math.round(mn)}</text><text x="146" y="127" text-anchor="middle" ${tx}>Bahis sırası (kümülatif net, ₺)</text></svg>`}
function analiz(B){const done=B.filter(b=>b.res&&b.res!='V');
  if(done.length<3)return '<div class="c"><h3>Analiz</h3><div class="mu">Analiz için en az 3 sonuçlanmış bahis gerekir.</div></div>';
  const grp=fn=>{const G={};for(const b of done){const k=fn(b),x=G[k]??={k,n:0,st:0,net:0,w:0};x.n++;x.st+=b.stake;x.net+=bprof(b);if(b.res=='W')x.w++}return Object.values(G).sort((a,b)=>b.net-a.net)};
  const line=x=>`<div class="li"><span>${esc(x.k)}<div class="mu">${x.n} bahis · tutan ${x.w} · oynanan ${TL(x.st)}</div></span><span style="text-align:right"><b style="color:${x.net>=0?'var(--h)':'var(--a)'}">${x.net>=0?'+':'−'}${TL(Math.abs(x.net))}</b><div class="mu">getiri %${x.st?Math.round(x.net/x.st*100):0}</div></span></div>`;
  const sub=t=>`<div class="mu" style="margin-top:12px"><b>${t}</b></div>`,bin=b=>b.odds<1.8?'Düşük oran (1.80 altı)':b.odds<2.5?'Orta oran (1.80–2.49)':'Yüksek oran (2.50+)';
  const S=done.slice().sort((a,b)=>a.ts-b.ts);let c=0;const pts=S.map((b,i)=>[i+1,(c+=bprof(b))]);
  const exp=done.reduce((a,b)=>a+1/b.odds,0)/done.length,act=done.filter(b=>b.res=='W').length/done.length;
  return `<div class="c"><h3>Analiz</h3>${curveSVG(pts)}<div class="mu" style="margin-top:6px">Oranlara göre beklenen tutma oranı <b>%${Math.round(exp*100)}</b>, senin gerçekleşen oranın <b>%${Math.round(act*100)}</b>. ${act<exp?'Oranların ima ettiğinden az tutturuyorsun.':'Oranların ima ettiğinden fazla tutturuyorsun.'} Ortalama oran ${(done.reduce((a,b)=>a+b.odds,0)/done.length).toFixed(2)}.</div>${sub('Bahis türüne göre')}${grp(b=>b.ty||'Diğer').map(line).join('')}${sub('Lige göre')}${grp(b=>b.lg||'Diğer').map(line).join('')}${sub('Orana göre')}${grp(bin).map(line).join('')}</div>`}
// ---- Öneri asistanı ----
const RES=[['H','MS 1',(i,j)=>i>j],['D','MS X',(i,j)=>i==j],['A','MS 2',(i,j)=>i<j],['1X','1X çifte şans',(i,j)=>i>=j],['X2','X2 çifte şans',(i,j)=>i<=j],['12','12 çifte şans',(i,j)=>i!=j]];
const GLS=[['O15','1.5 Üst',(i,j)=>i+j>1],['U15','1.5 Alt',(i,j)=>i+j<=1],['O25','2.5 Üst',(i,j)=>i+j>2],['U25','2.5 Alt',(i,j)=>i+j<=2],['O35','3.5 Üst',(i,j)=>i+j>3],['U35','3.5 Alt',(i,j)=>i+j<=3],['BTS','KG Var',(i,j)=>i>0&&j>0],['NBTS','KG Yok',(i,j)=>i==0||j==0]];
const CAND=[];
for(const r of RES)CAND.push({k:r[0],l:r[1],f:r[2],t:'s',rk:r[0]});
for(const g of GLS)CAND.push({k:g[0],l:g[1],f:g[2],t:'s',gk:g[0]});
for(const r of RES)for(const g of GLS)CAND.push({k:r[0]+'|'+g[0],l:r[1]+' ve '+g[1],f:(i,j)=>r[2](i,j)&&g[2](i,j),t:'c',rk:r[0],gk:g[0]});
for(const [a,b] of [['O25','BTS'],['U25','NBTS'],['O15','BTS'],['O35','BTS'],['U35','NBTS']]){const A=GLS.find(x=>x[0]==a),B=GLS.find(x=>x[0]==b);CAND.push({k:a+'|'+b,l:A[1]+' ve '+B[1],f:(i,j)=>A[2](i,j)&&B[2](i,j),t:'c',gk:a,gk2:b})}
const candP=(mx,c)=>{let s=0;for(let i=0;i<mx.length;i++)for(let j=0;j<mx[i].length;j++)if(c.f(i,j))s+=mx[i][j];return s};
const assistPicks=mx=>CAND.map(c=>({c,p:candP(mx,c)}));
function takeDistinct(L,n,lim){const used={},out=[];for(const x of L){const ks=[x.c.rk,x.c.gk,x.c.gk2].filter(Boolean);if(ks.some(k=>(used[k]||0)>=lim))continue;ks.forEach(k=>used[k]=(used[k]||0)+1);out.push(x);if(out.length>=n)break}return out}
const pickList=(all,type,n,lo=.45,hi=.9)=>takeDistinct(all.filter(x=>x.c.t==type&&x.p>=lo&&x.p<=hi).sort((a,b)=>b.p-a.p),n,2);
const pickTarget=(all,thr,n)=>takeDistinct(all.filter(x=>x.p>=thr&&x.p<=0.95).sort((a,b)=>a.p-b.p),n,2);
const apKeys=mx=>{const a=assistPicks(mx);return [...pickList(a,'s',3),...pickList(a,'c',3)].map(x=>({k:x.c.k,p:+x.p.toFixed(3)}))};
function modFor(f,m){
  if(!m.hist.length)return NOHIST(m);
  const h=findTeam(f.teams.home.name,m.hist),a=findTeam(f.teams.away.name,m.hist);
  if(!h||!a)return '<div class="c">Bu maçın takımları geçmiş veri dosyalarında eşleşmedi, tahmin üretilemiyor.</div>';
  if(!m.md)return '<div class="c mu">Model hazırlanıyor… (ilk seferde birkaç saniye sürebilir)</div>';
  if(!m.mod){const r=pred2(m.md,h,a,f.fixture.date);m.mod={M:m.md.M,r,ht:htft(m.md.M,r.lh,r.la),bt:m.md.cmp};logPred(f,r,apKeys(r.mx))}
  m.h=h;m.a=a;return null}
function reasons(f,m,r,mkp,mp){
  const R=[],h=m.h,a=m.a,M=m.md.M,hi=m.hist,hn=esc(f.teams.home.name),an=esc(f.teams.away.name),tot=r.lh+r.la;
  R.push(`Model ${hn} için ${r.lh.toFixed(2)}, ${an} için ${r.la.toFixed(2)} gol bekliyor (toplam ${tot.toFixed(2)}${tot>2.9?', gollü maç':tot<2.3?', az gollü maç':''}).`);
  const ah=M.atk(h),da=M.def(a),aa=M.atk(a),dh=M.def(h);
  if(ah>1.15)R.push(`${hn} hücumda ligin üzerinde (×${ah.toFixed(2)}).`);
  if(da>1.15)R.push(`${an} savunmada ortalamanın altında (×${da.toFixed(2)}, 1 = ortalama).`);
  if(aa>1.15)R.push(`${an} hücumda ligin üzerinde (×${aa.toFixed(2)}).`);
  if(dh>1.15)R.push(`${hn} savunmada ortalamanın altında (×${dh.toFixed(2)}).`);
  if(ah<.85&&aa<.85)R.push('İki takımın da hücumu ligin altında, düşük skor ihtimali yüksek.');
  const pts=n=>{const g=hi.filter(p=>p.h==n||p.a==n).sort((x,y)=>y.d-x.d).slice(0,5);return g.reduce((s2,p)=>{const q=tres(p,n);return s2+(q=='G'?3:q=='B'?1:0)},0)+'/'+(g.length*3)};
  R.push(`Son 5 maçta aldıkları puan: ${hn} ${pts(h)}, ${an} ${pts(a)}.`);
  const st=[...streaks(hi,h).map(x=>[hn,x]),...streaks(hi,a).map(x=>[an,x])].filter(x=>x[1].n>=4).sort((x,y)=>y[1].n-x[1].n)[0];if(st)R.push(`${st[0]}: ${sPhrase(st[1])}.`);
  const g2=hi.filter(p=>(p.h==h&&p.a==a)||(p.h==a&&p.a==h));if(g2.length>=3)R.push(`Aralarındaki son ${g2.length} maçta maç başı ${(g2.reduce((s2,p)=>s2+p.hg+p.ag,0)/g2.length).toFixed(1)} gol atıldı.`);
  if(mkp)R.push(`Piyasa 1 için %${Math.round(mkp[0]*100)}, model %${Math.round(mp[0]*100)} veriyor; asistan ikisini karıştırıyor.`);
  if(m.done&&m.done.inj){const c1=m.inj.filter(i=>i.team.id==f.teams.home.id).length,c2=m.inj.filter(i=>i.team.id==f.teams.away.id).length;if(c1+c2)R.push(`Eksik oyuncu: ${hn} ${c1}, ${an} ${c2}. Model bunları hesaba katmıyor, Eksikler sekmesine bak.`)}
  return R.slice(0,6)}
function setThr(v){D.m.thr=v/100;draw()}
function tAsistan(f,m){
  const msg=modFor(f,m);if(msg)return msg;
  const r=m.mod.r,bt=m.md.cmp,best=m.md.best,thr=m.thr||0.65,evs=(bt.recs||[]).flatMap(e=>(e.ev&&e.ev[best])||[]);
  const o=m.odds&&!m.odds.some(isNaN)?m.odds:null,mp=[r.H,r.D,r.A];let mx=r.mx,mkp=null;
  if(o){const inv=o.map(x=>1/x),t=inv[0]+inv[1]+inv[2],bw=bt.bl?bt.bl.w:0.5;mkp=inv.map(x=>x/t);
    const fp=mp.map((v,i)=>bw*v+(1-bw)*mkp[i]),ff=fp.map((v,i)=>v/mp[i]);
    mx=mx.map((row,i)=>row.map((p,j)=>p*ff[i>j?0:i==j?1:2]));const tt=mx.reduce((a,row)=>a+row.reduce((b,x)=>b+x,0),0);mx=mx.map(row=>row.map(p=>p/tt))}
  const mo={};if(o){mo.H=o[0];mo.D=o[1];mo.A=o[2]}if(m.ou&&!m.ou.some(isNaN)){mo.O25=m.ou[0];mo.U25=m.ou[1]}
  const all=assistPicks(mx),singles=pickList(all,'s',5),combos=pickList(all,'c',5),tgt=pickTarget(all,thr,5);
  const conf=p=>{const sel=evs.filter(e=>Math.abs(e[0]-p)<=.06),n=sel.length;if(n<30)return ['Yetersiz geçmiş','var(--mu)',null,n];
    const obs=sel.reduce((a,e)=>a+e[1],0)/n,d=obs-p,ok=Math.abs(d)<=.07;return [ok?'Güvenilir':d<0?'Abartılı olabilir':'Temkinli',ok?'var(--h)':d<0?'var(--a)':'var(--d)',obs,n]};
  const badge=p=>{const [lb,col,obs,n]=conf(p);return `<span class="tag" style="background:${col}">${lb}</span>${obs!=null?` <span class="mu">benzer tahminlerde gerçekleşen %${Math.round(obs*100)} (${n} olay)</span>`:''}`};
  const pk=x=>{let ex=`adil oran ${(1/x.p).toFixed(2)}`;const q=mo[x.c.k];if(q&&!isNaN(q)){const e=x.p*q-1;ex+=` · piyasa ${q.toFixed(2)} (${e>=0?'+':'−'}%${Math.round(Math.abs(e)*100)})`}
    return `<div class="li" style="align-items:flex-start"><span><b>${esc(x.c.l)}</b><div class="mu">${ex}</div><div>${badge(x.p)}</div></span><b style="font-size:18px">${P(x.p)}</b></div>`};
  const top=combos[0]||singles[0];let s='';
  if(top){s+=`<div class="c" style="border-color:var(--ac)"><div class="mu">Asistanın önerisi</div><div style="font-size:20px;font-weight:700;margin:4px 0">${esc(top.c.l)}</div><div style="font-size:30px;font-weight:700;color:var(--ac)">${P(top.p)}</div><div class="mu">adil oran ${(1/top.p).toFixed(2)}</div><div style="margin-top:4px">${badge(top.p)}</div><div style="margin-top:10px"><b>Neden?</b></div>${reasons(f,m,r,mkp,mp).map(x=>`<div class="mu" style="margin-top:4px">• ${x}</div>`).join('')}</div>`}
  else s+='<div class="c">Bu maçta net bir öneri çıkmadı.</div>';
  if(!o)s+=`<div class="c"><div class="mu">Şu an sadece model konuşuyor. Piyasa oranıyla karıştırıp daha isabetli bir tahmin için oranı çekebilirsin (1 istek):</div><button class="chip" onclick="need(7)">Oranı çek</button></div>`;
  else s+=`<div class="c mu">Tahminler, model ve piyasa oranının karışımıyla hesaplandı (%${Math.round((bt.bl?bt.bl.w:0.5)*100)} model).</div>`;
  s+=`<div class="c"><h3>Kombine seçimler</h3>${combos.map(pk).join('')||'<span class="mu">Yok</span>'}</div>`;
  s+=`<div class="c"><h3>Tekli seçimler</h3>${singles.map(pk).join('')||'<span class="mu">Yok</span>'}</div>`;
  s+=`<div class="c"><h3>Hedef olasılığa göre</h3><div class="mu">En az <b id="thv">${Math.round(thr*100)}</b>% ihtimalli seçimler, adil oranı en yüksek olandan başlayarak:</div><input type="range" min="50" max="90" step="5" value="${Math.round(thr*100)}" oninput="document.getElementById('thv').textContent=this.value" onchange="setThr(this.value)" style="margin:8px 0">${tgt.map(pk).join('')||'<span class="mu">Bu eşikte seçim yok. Eşiği düşür.</span>'}</div>`;
  s+='<p class="mu">Asistan, geçmiş sonuçlardan öğrenen istatistiksel bir modeldir; yapay zekâ sohbet botu değildir. Olasılık kesinlik değildir. Sakatlık, kadro, hava ve motivasyonu bilmez. “Güvenilir/Abartılı” etiketi, modelin geçmiş maçlarda benzer ihtimal verdiği olayların gerçekte ne kadar tuttuğuna bakar. Bahis para kaybettirebilir.</p>';
  return s}
function asistKarne(S){const B=[[0,.6],[.6,.7],[.7,.8],[.8,1.01]],A=B.map(()=>({n:0,h:0,p:0}));let any=0;
  for(const x of S){if(!x.ap)continue;for(const q of x.ap){const c=CAND.find(c=>c.k==q.k);if(!c)continue;any++;const hit=c.f(x.res.hg,x.res.ag)?1:0,i=B.findIndex(b=>q.p>=b[0]&&q.p<b[1]);if(i>=0){A[i].n++;A[i].h+=hit;A[i].p+=q.p}}}
  if(!any)return '';
  return `<div class="c"><h3>Asistan isabeti</h3><div class="mu">Asistanın önerdiği seçimler, maç bitince gerçek sonuçla karşılaştırılır.</div>${B.map((b,i)=>A[i].n?`<div class="li"><span>%${Math.round(b[0]*100)}–${Math.min(100,Math.round(b[1]*100))} olasılıklı seçimler<div class="mu">${A[i].n} seçim · ortalama iddia %${Math.round(A[i].p/A[i].n*100)}</div></span><b>tutan %${Math.round(A[i].h/A[i].n*100)}</b></div>`:'').join('')}</div>`}
function tOran(f,m){const o=m.odds;if(!o||o.some(isNaN))return `<div class="c mu">${m.loading?'Yükleniyor…':'Bu maç için oran bulunamadı (oranlar genelde maçtan birkaç gün önce açılır).'}</div>`;
  const d=p=>o.reduce((s,v,i)=>s+Math.abs(p.o[i]-v)/v,0);
  const S=m.hist.filter(p=>o.every((v,i)=>Math.abs(p.o[i]-v)/v<=TOL)).sort((a,b)=>d(a)-d(b)),n=S.length,c=k=>S.filter(x=>x.r==k).length;
  const inv=o.map(x=>1/x),tot=inv.reduce((a,b)=>a+b,0);
  let s=`<div class="c"><h3>Güncel oranlar</h3>1: ${o[0].toFixed(2)} &nbsp; X: ${o[1].toFixed(2)} &nbsp; 2: ${o[2].toFixed(2)}<div class="mu" style="margin-top:10px">Benzerlik toleransı: ±%<span id="tv">${Math.round(TOL*100)}</span></div><input type="range" min="0.03" max="0.25" step="0.01" value="${TOL}" onchange="TOL=+this.value;draw()" oninput="document.getElementById('tv').textContent=Math.round(this.value*100)"></div>`;
  s+=extra(m);
  if(!m.hist.length)return s+(m.hdone?`<div class="c">Geçmiş veri dosyaları bulunamadı. GitHub’da Actions → Veri güncelle → Run workflow ile indir, 1 dakika sonra sayfayı yenile.<br><button class="bt" onclick="retryH()">Tekrar dene</button></div>`:`<div class="c mu">Geçmiş maçlar indiriliyor, bu 20-30 saniye sürebilir…</div>`);
  if(!n)return s+'<div class="c">Bu aralıkta benzer maç yok. Toleransı artır.</div>';
  const P=x=>Math.round(x/n*100);
  s+=`<div class="c"><h3>${n} benzer maç</h3>${bar(c('H'),c('D'),c('A'))}<div>Gerçekleşen: 1 %${P(c('H'))} · X %${P(c('D'))} · 2 %${P(c('A'))}</div><div class="mu" style="margin-top:6px">Oranın ima ettiği: 1 %${Math.round(inv[0]/tot*100)} · X %${Math.round(inv[1]/tot*100)} · 2 %${Math.round(inv[2]/tot*100)}</div></div>`;
  return s+`<div class="c">`+S.slice(0,40).map(p=>`<div class="li"><span>${esc(p.h)} – ${esc(p.a)}<div class="mu">${p.o.map(x=>x.toFixed(2)).join(' / ')} · ${p.s.slice(0,2)}/${p.s.slice(2)}</div></span><b>${p.hg}-${p.ag}</b></div>`).join('')+'</div>'}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

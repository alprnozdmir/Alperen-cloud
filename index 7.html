<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maç Analiz</title>
<style>
:root{--bg:#f4f6f5;--cd:#fff;--tx:#14201a;--mu:#6b7a72;--ac:#0f9d58;--bd:#e2e8e4;--h:#0f9d58;--d:#d99a1c;--a:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--cd:#18211c;--tx:#e8f0ea;--mu:#8fa196;--ac:#2fd283;--bd:#26332b;--h:#2fd283;--d:#e5b04a;--a:#ec6a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 8px}h3{margin:0 0 8px;font-size:15px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}.m{cursor:pointer;display:flex;gap:10px;align-items:center}
.m .t{width:44px;color:var(--mu);font-size:13px}.m .n{flex:1}.m b{text-align:right}
.lg{font-size:12px;color:var(--mu);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
button,input{font:inherit}
.bk{background:none;border:0;color:var(--ac);padding:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.tabs button{flex:1 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:13px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=date],input[type=password],input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--ac)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0;gap:2px}.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pt{background:rgba(15,157,88,.16);border-radius:8px;padding:8px;margin:6px 0;text-align:center;font-size:14px}
.tag{font-size:11px;color:#fff;border-radius:6px;padding:2px 8px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.err{color:var(--a);font-size:13px;margin:8px 0}
.bt{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const $a=document.getElementById('app');
let KEY=localStorage.getItem('apikey')||'',DATE=new Date().toISOString().slice(0,10),TAB=0,TOL=0.10,CUR=null,D={};
const CODE={203:'T1',39:'E0',140:'SP1',135:'I1',78:'D1',61:'F1'},SHOW=[203,39,140,135,78,61,2,3,848];
const SEA=['2223','2324','2425','2526','2627'],HC={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=s=>parseFloat(String(s).replace('%',''))||0;
const dayKey=()=>new Date().toISOString().slice(0,10);
function used(){try{const u=JSON.parse(localStorage.getItem('used')||'{}');return u.d==dayKey()?u.n:0}catch(e){return 0}}
function bump(){try{localStorage.setItem('used',JSON.stringify({d:dayKey(),n:used()+1}))}catch(e){}}
function prune(){try{Object.keys(localStorage).filter(k=>k.startsWith('c:')).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function api(p,q,ttl=6*36e5){
  const ck='c:'+p+'?'+new URLSearchParams(q);
  try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&Date.now()-c.t<c.ttl)return c.v}catch(e){}
  const r=await fetch('https://v3.football.api-sports.io/'+p+'?'+new URLSearchParams(q),{headers:{'x-apisports-key':KEY}});bump();
  const j=await r.json();const e=Object.values(j.errors||{})[0];if(e)throw new Error(e);
  const v=j.response||[],rec=JSON.stringify({t:Date.now(),ttl:v.length?ttl:Math.min(ttl,20*6e4),v});
  try{localStorage.setItem(ck,rec)}catch(x){prune();try{localStorage.setItem(ck,rec)}catch(y){}}
  return v}
function bar(h,d,a){const t=(h+d+a)||1;return `<div class="bar"><i style="width:${h/t*100}%;background:var(--h)"></i><i style="width:${d/t*100}%;background:var(--d)"></i><i style="flex:1;background:var(--a)"></i></div>`}
function setKey(){const v=document.getElementById('k').value.trim();if(!v)return;KEY=v;localStorage.setItem('apikey',v);localStorage.removeItem('nofb');home()}
async function home(){
  CUR=null;
  if(!KEY){$a.innerHTML=`<h1>Maç Analiz</h1><div class="c"><h3>API-Football anahtarı</h3><input type="password" id="k" placeholder="Anahtarı yapıştır"><button class="bt" onclick="setKey()">Kaydet</button><p class="mu">Ücretsiz anahtar: dashboard.api-football.com (günde 100 istek). Anahtar sadece bu tarayıcıda saklanır.</p></div>`;return}
  $a.innerHTML=`<h1>Günün Maçları</h1><input type="date" id="dt" value="${DATE}" onchange="DATE=this.value;home()"><div class="mu" id="u" style="margin-top:6px">Bugün kullanılan istek: ~${used()}/100</div><div id="l" class="mu" style="margin-top:12px">Yükleniyor…</div><p class="mu"><a href="#" onclick="localStorage.removeItem('apikey');KEY='';home();return false" style="color:var(--mu)">Anahtarı değiştir</a></p>`;
  try{
    const all=(await api('fixtures',{date:DATE,timezone:'Europe/Istanbul'},18e5)).filter(f=>SHOW.includes(f.league.id)).sort((a,b)=>a.fixture.date.localeCompare(b.fixture.date));
    D.list=all;{const u=document.getElementById('u');if(u)u.textContent='Bugün kullanılan istek: ~'+used()+'/100'}const g={};all.forEach(f=>(g[f.league.name]??=[]).push(f));
    document.getElementById('l').outerHTML=Object.keys(g).sort().map(n=>`<div class="lg">${esc(n)}</div>`+g[n].map(f=>{
      const t=new Date(f.fixture.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
      const sc=f.goals.home!=null?`<b>${f.goals.home}<br>${f.goals.away}</b>`:'';
      return `<div class="c m" onclick="openM(${f.fixture.id})"><span class="t">${t}</span><span class="n">${esc(f.teams.home.name)}<br>${esc(f.teams.away.name)}</span>${sc}</div>`}).join('')).join('')||'<div class="c">Bu tarihte listelenen lig maçı yok.</div>';
  }catch(e){document.getElementById('l').outerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function openM(id){
  CUR=D.list.find(f=>f.fixture.id==id);TAB=0;
  D.m={loading:0,err:null,odds:null,hist:[],pred:null,inj:[],lu:[],probable:false,done:{}};
  need(0);histLoad()}
function setTab(i){TAB=i;D.m.err=null;need(i)}
async function histLoad(){const m=D.m;if(m.hstart)return;m.hstart=1;m.hist=await loadHist(CUR.league.id);m.hdone=true;draw()}
async function need(i){
  const m=D.m,f=CUR,id=f.fixture.id;
  const run=async(k,fn)=>{if(m.done[k])return;m.done[k]=1;m.loading++;draw();try{await fn()}catch(e){m.err=e.message}m.loading--;draw()};
  if(i==2)run('pred',async()=>{m.pred=(await api('predictions',{fixture:id},12*36e5))[0]||null});
  if(i==3)run('lu',async()=>{m.lu=await api('fixtures/lineups',{fixture:id},6*36e5);
    if(m.lu.length<2&&!localStorage.getItem('nofb')){m.probable=true;const out=[];
      try{for(const tm of [f.teams.home,f.teams.away]){
        const to=new Date(DATE),fr=new Date(DATE);fr.setDate(fr.getDate()-30);const iso=d=>d.toISOString().slice(0,10);
        const ss=to.getMonth()>=6?to.getFullYear():to.getFullYear()-1;
        const fx=(await api('fixtures',{team:tm.id,from:iso(fr),to:iso(to),season:String(ss)},12*36e5)).filter(z=>z.fixture.status.short=='FT').sort((a,b)=>b.fixture.date.localeCompare(a.fixture.date));
        if(fx[0]){const l=await api('fixtures/lineups',{fixture:fx[0].fixture.id},48*36e5);const x=l.find(z=>z.team.id==tm.id);if(x)out.push(x)}}}
      catch(e){try{localStorage.setItem('nofb','1')}catch(x){}}
      m.lu=out}});
  if(i==4)run('inj',async()=>{m.inj=await api('injuries',{fixture:id},3*36e5)});
  if(i==5)run('odds',async()=>{
    const o=await api('odds',{fixture:id},3*36e5);
    const bms=o?.[0]?.bookmakers||[];const bm=bms.find(b=>b.bets.some(x=>x.id==1))||bms[0];
    const g=k=>bm?.bets.find(b=>b.id==k)||bms.flatMap(b=>b.bets).find(b=>b.id==k);
    const w=g(1),h7=g(7),o5=g(5);
    if(h7){m.htft={};h7.values.forEach(v=>m.htft[v.value]=parseFloat(v.odd))}
    if(o5){const u=n=>parseFloat(o5.values.find(x=>x.value==n)?.odd);m.ou=[u('Over 2.5'),u('Under 2.5')]}
    if(w){const v=n=>parseFloat(w.values.find(x=>x.value==n)?.odd);m.odds=[v('Home'),v('Draw'),v('Away')]}});
  draw()}
function draw(){
  const f=CUR,m=D.m;if(!f)return;
  const T=['Tahmin','Form','Analiz','Kadro','Eksikler','Oran'];
  $a.innerHTML=`<button class="bk" onclick="home()">‹ Maçlar</button><h1>${esc(f.teams.home.name)} – ${esc(f.teams.away.name)}</h1><div class="mu">${esc(f.league.name)}</div><div class="tabs">${T.map((x,i)=>`<button class="${i==TAB?'on':''}" onclick="setTab(${i})">${x}</button>`).join('')}</div>${m.loading?'<div class="mu">Yükleniyor…</div>':''}${m.err?`<div class="err">${esc(m.err)}</div>`:''}`+[tTahmin,tForm,tAnaliz,tKadro,tEksik,tOran][TAB](f,m)+`<p class="mu">Bugün kullanılan istek: ~${used()}/100 · sekmeler açıldıkça veri çekilir, tekrar açınca önbellekten gelir.</p>`;
}
const NAMES={form:'Form',att:'Hücum',def:'Savunma',h2h:'Karşılaşma geçmişi',goals:'Gol',total:'Genel'};
function tAnaliz(f,m){const p=m.pred;if(!p)return m.loading?'':'<div class="c">Bu maç için analiz verisi yok.</div>';
  let s='';const q=p.predictions.percent;
  if(q)s+=`<div class="c"><h3>Tahmin olasılıkları</h3>${bar(pc(q.home),pc(q.draw),pc(q.away))}<div class="row"><span>1 ${q.home}</span><span>X ${q.draw}</span><span>2 ${q.away}</span></div></div>`;
  if(p.predictions.advice)s+=`<div class="c"><h3>Öneri</h3>${esc(p.predictions.advice)}</div>`;
  if(p.comparison)s+=`<div class="c"><h3>Karşılaştırma</h3>`+Object.keys(NAMES).filter(k=>p.comparison[k]).map(k=>{const v=p.comparison[k];return `<div class="row mu" style="margin-top:8px"><span>${v.home}</span><span>${NAMES[k]}</span><span>${v.away}</span></div>${bar(pc(v.home),0,pc(v.away))}`}).join('')+'</div>';
  return s}
function tKadro(f,m){
  let s=m.probable&&m.lu.length?'<p class="mu">Kadrolar henüz açıklanmadı. Gösterilen, takımın son maçındaki ilk 11’dir (muhtemel).</p>':'';
  s+=m.lu.map(l=>`<div class="c"><h3>${esc(l.team.name)} ${l.formation?'· '+l.formation:''}</h3>`+['G','D','M','F'].map(p=>{const a=l.startXI.filter(x=>x.player.pos==p);return a.length?`<div class="pt">${a.map(x=>esc(x.player.name)).join(' · ')}</div>`:''}).join('')+'</div>').join('');
  return s||(m.loading?'':'<div class="c">Kadro henüz açıklanmadı. Genelde maçtan yaklaşık bir saat önce açıklanır.</div>')}
function kind(i){const r=(i.player.reason||'').toLowerCase();if(r.includes('suspen')||r.includes('card'))return['Cezalı','var(--d)'];if(i.player.type=='Questionable')return['Şüpheli','#6a7fd6'];return['Sakat','var(--a)']}
function tEksik(f,m){return [f.teams.home,f.teams.away].map(t=>{const l=m.inj.filter(i=>i.team.id==t.id);
  return `<div class="c"><h3>${esc(t.name)}</h3>`+(l.length?l.map(i=>{const[k,c]=kind(i);return `<div class="li"><span>${esc(i.player.name)}<div class="mu">${esc(i.player.reason||'')}</div></span><span class="tag" style="background:${c}">${k}</span></div>`}).join(''):'<span class="mu">Kayıtlı eksik yok</span>')+'</div>'}).join('')}
// Geçmiş oran verisi: data/ klasörü (GitHub Actions football-data.co.uk'den indirir)
async function getCSV(f){try{const r=await fetch(f);if(r.ok){const t=await r.text();if(t.includes('HomeTeam'))return t}}catch(e){}return ''}
function parse(t){const L=t.replace(/\r/g,'').split('\n');if(L.length<2)return[];const h=L[0].replace('\uFEFF','').split(',');const ix=n=>h.indexOf(n);
  const idt=ix('Date'),ihh=ix('HTHG'),iha=ix('HTAG');const pdt=x=>{const m=(x||'').match(/(\d+)\/(\d+)\/(\d+)/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()};
  const [ih,ia,ig,ig2]=['HomeTeam','AwayTeam','FTHG','FTAG'].map(ix);if([ih,ia,ig,ig2].some(x=>x<0))return[];
  const S=[['B365H','B365D','B365A'],['AvgH','AvgD','AvgA'],['PSH','PSD','PSA']].map(s=>s.map(ix)).filter(s=>s.every(x=>x>=0));const out=[];
  for(const ln of L.slice(1)){const c=ln.split(',');const hg=parseInt(c[ig]),ag=parseInt(c[ig2]);if(isNaN(hg)||isNaN(ag))continue;
    let o=null;for(const s of S){const v=s.map(i=>parseFloat(c[i]));if(v.every(x=>x>0)){o=v;break}}if(!o)continue;
    out.push({h:c[ih],a:c[ia],hg,ag,r:hg>ag?'H':hg<ag?'A':'D',o,d:pdt(c[idt]),hh:(x=>isNaN(x)?null:x)(ihh>=0?parseInt(c[ihh]):NaN),ha:(x=>isNaN(x)?null:x)(iha>=0?parseInt(c[iha]):NaN)})}return out}
async function loadHist(lid){const codes=CODE[lid]?[CODE[lid]]:Object.values(CODE);let all=[];
  for(const c of codes){if(!HC[c]){const parts=await Promise.all(SEA.map(async s=>{const t=await getCSV(`data/${c}_${s}.csv`);return parse(t).map(x=>({...x,s}))}));HC[c]=parts.flat();if(!HC[c].length)delete HC[c]}all=all.concat(HC[c]||[])}return all}
async function retryH(){D.m.hdone=false;draw();D.m.hist=await loadHist(CUR.league.id);D.m.hdone=true;draw()}
function extra(m){let s='';
  if(m.htft&&Object.keys(m.htft).length){const L={Home:'1',Draw:'X',Away:'2'},f=v=>isNaN(v)?'-':v.toFixed(2);
    const big=[['Home/Away','1/2'],['Away/Home','2/1']].map(([k,l])=>`<div style="flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:8px"><div class="mu">İY/MS ${l}</div><b style="font-size:20px">${f(m.htft[k])}</b></div>`).join('');
    const rest=Object.keys(m.htft).filter(k=>k!='Home/Away'&&k!='Away/Home').map(k=>{const[a,b]=k.split('/');return `<span class="mu" style="width:33%;display:inline-block;margin-top:6px">${L[a]}/${L[b]}: ${f(m.htft[k])}</span>`}).join('');
    s+=`<div class="c"><h3>İlk yarı / Maç sonucu</h3><div style="display:flex;gap:8px">${big}</div><div>${rest}</div></div>`}
  if(m.ou&&!m.ou.some(isNaN))s+=`<div class="c"><h3>2.5 Alt / Üst</h3><div class="row"><span>Alt: <b>${m.ou[1].toFixed(2)}</b></span><span>Üst: <b>${m.ou[0].toFixed(2)}</b></span></div></div>`;
  return s}
const AL={nottm:'nottingham',wolves:'wolverhampton',spurs:'tottenham'},STOP=['fc','sk','fk','cf','sc','ac','afc','as','cd','ud','rc','ssc','fc'];
const norm=n=>n.replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(w=>w&&!STOP.includes(w));
function findTeam(name,hist){const A=norm(name);const names=[...new Set(hist.flatMap(p=>[p.h,p.a]))];let best=null,bs=0;
  for(const n of names){const T=norm(n).map(t=>AL[t]||t);if(!T.length)continue;
    const ok=T.filter(t=>t.length>=3&&A.some(a=>a.startsWith(t))).length;const sc=ok/T.length+(A.length==T.length?0.01:0);
    if(sc>bs){bs=sc;best=n}}
  return bs>=1?best:null}
function tForm(f,m){
  if(!m.hist.length)return `<div class="c mu">${m.hdone?'Geçmiş veri bulunamadı (Oran sekmesindeki açıklamaya bak).':'Geçmiş maçlar indiriliyor…'}</div>`;
  return [f.teams.home,f.teams.away].map(t=>{const n=findTeam(t.name,m.hist);
    if(!n)return `<div class="c"><h3>${esc(t.name)}</h3><span class="mu">Bu takım için geçmiş veri bulunamadı (lig veri dosyalarında yok ya da isim eşleşmedi).</span></div>`;
    const g=m.hist.filter(p=>p.h==n||p.a==n).sort((a,b)=>b.d-a.d).slice(0,10);
    const ust=g.filter(p=>p.hg+p.ag>2).length,kg=g.filter(p=>p.hg>0&&p.ag>0).length,avg=(g.reduce((a,p)=>a+p.hg+p.ag,0)/g.length).toFixed(2);
    const dt=x=>x?new Date(x).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}):'';
    return `<div class="c"><h3>${esc(t.name)} · son ${g.length} maç</h3><div class="row" style="margin-bottom:6px"><span>2.5 Üst: <b>${ust}</b>/${g.length}</span><span>Alt: <b>${g.length-ust}</b>/${g.length}</span><span>KG Var: <b>${kg}</b>/${g.length}</span></div><div class="mu">Maç başı ortalama gol: ${avg}</div>`+
      g.map(p=>{const u=p.hg+p.ag>2;return `<div class="li"><span>${esc(p.h)} – ${esc(p.a)}<div class="mu">${dt(p.d)}</div></span><span><b>${p.hg}-${p.ag}</b> <span class="tag" style="background:${u?'var(--h)':'var(--a)'}">${u?'Üst':'Alt'}</span></span></div>`}).join('')+'</div>'}).join('')}
// ---- Tahmin modeli: zaman ağırlıklı Poisson (hücum/savunma gücü) ----
const pois=(l,n=9)=>{const a=[Math.exp(-l)];for(let i=1;i<n;i++)a.push(a[i-1]*l/i);return a};
function fit(rows,asOf){
  const w=p=>Math.pow(.5,Math.max(0,asOf-p.d)/(300*864e5));
  let sw=0,sh=0,sa=0,ph=0,pt=0;
  for(const p of rows){const x=w(p);sw+=x;sh+=x*p.hg;sa+=x*p.ag;if(p.hh!=null&&p.ha!=null){ph+=x*(p.hh+p.ha);pt+=x*(p.hg+p.ag)}}
  const mH=sh/sw,mA=sa/sw,T={};
  const add=(t,k,v,x)=>{const e=T[t]??={a:0,aw:0,d:0,dw:0};e[k]+=v*x;e[k+'w']+=x};
  for(const p of rows){const x=w(p);add(p.h,'a',p.hg/mH,x);add(p.h,'d',p.ag/mA,x);add(p.a,'a',p.ag/mA,x);add(p.a,'d',p.hg/mH,x)}
  const K=4,st=(t,k)=>{const e=T[t];return e?(e[k]+K)/(e[k+'w']+K):1};
  return {mH,mA,p1:pt?ph/pt:0.44,atk:t=>st(t,'a'),def:t=>st(t,'d'),n:t=>T[t]?.aw||0}
}
function predict(M,h,a){
  const lh=M.mH*M.atk(h)*M.def(a),la=M.mA*M.atk(a)*M.def(h),ph=pois(lh),pa=pois(la);
  let H=0,D=0,A=0,o15=0,o25=0,o35=0,bt=0,tot=0;const sc=[];
  for(let i=0;i<ph.length;i++)for(let j=0;j<pa.length;j++){const p=ph[i]*pa[j];tot+=p;
    if(i>j)H+=p;else if(i<j)A+=p;else D+=p;const g=i+j;if(g>1)o15+=p;if(g>2)o25+=p;if(g>3)o35+=p;if(i>0&&j>0)bt+=p;sc.push([i+'-'+j,p])}
  sc.sort((x,y)=>y[1]-x[1]);
  return {lh,la,H:H/tot,D:D/tot,A:A/tot,o15:o15/tot,o25:o25/tot,o35:o35/tot,bt:bt/tot,sc:sc.slice(0,5).map(x=>[x[0],x[1]/tot])}
}
function htft(M,lh,la){
  const p1=M.p1,a1=pois(lh*p1,7),b1=pois(la*p1,7),a2=pois(lh*(1-p1),7),b2=pois(la*(1-p1),7),R={};let tot=0;
  const k=(x,y)=>x>y?'1':x<y?'2':'X';
  for(let i=0;i<7;i++)for(let j=0;j<7;j++)for(let u=0;u<7;u++)for(let v=0;v<7;v++){const p=a1[i]*b1[j]*a2[u]*b2[v];const key=k(i,j)+'/'+k(i+u,j+v);R[key]=(R[key]||0)+p;tot+=p}
  for(const x in R)R[x]/=tot;return R
}
function backtest(rows,n){
  const last=rows.slice().sort((a,b)=>b.d-a.d).slice(0,n);let N=0,c=0,mk=0,o=0;
  for(const p of last){const M=fit(rows.filter(x=>x.d<p.d),p.d);if(M.n(p.h)<8||M.n(p.a)<8)continue;
    const r=predict(M,p.h,p.a);const pick=r.H>=r.D&&r.H>=r.A?'H':r.A>=r.D?'A':'D';
    const mi=p.o.indexOf(Math.min(...p.o)),mp=['H','D','A'][mi];
    N++;if(pick==p.r)c++;if(mp==p.r)mk++;if((r.o25>.5)==(p.hg+p.ag>2))o++}
  return {N,c,mk,o}
}
const P=x=>Math.round(x*100)+'%';
function lean(p){return p>=.55?'Üst bekleniyor':p<=.45?'Alt bekleniyor':'Belirsiz'}
function tTahmin(f,m){
  if(!m.hist.length)return `<div class="c mu">${m.hdone?'Geçmiş veri bulunamadı. Tahmin için data klasörü gerekli (Oran sekmesindeki açıklamaya bak).':'Geçmiş maçlar indiriliyor…'}</div>`;
  const h=findTeam(f.teams.home.name,m.hist),a=findTeam(f.teams.away.name,m.hist);
  if(!h||!a)return '<div class="c">Bu maçın takımları geçmiş veri dosyalarında eşleşmedi, tahmin üretilemiyor.</div>';
  if(!m.mod){const rows=m.hist.filter(p=>p.d);const M=fit(rows,Date.now()),r=predict(M,h,a);m.mod={M,r,ht:htft(M,r.lh,r.la),bt:backtest(rows,120)}}
  const {M,r,ht,bt}=m.mod,o=m.odds&&!m.odds.some(isNaN)?m.odds:null;
  const row=(l,p,x)=>`<div style="margin-top:8px"><div class="row"><span>${l}${x?` <span class="mu">${x}</span>`:''}</span><b>${P(p)}</b></div><div class="bar"><i style="width:${p*100}%;background:var(--ac)"></i><i style="flex:1;background:var(--bd)"></i></div></div>`;
  let s='';
  if(M.n(h)<10||M.n(a)<10)s+='<div class="err">Bu takımlardan biri için az geçmiş veri var, tahmin daha az güvenilir.</div>';
  s+=`<div class="c"><h3>Maç sonucu</h3>${bar(r.H,r.D,r.A)}<div class="row"><span>1 ${P(r.H)}</span><span>X ${P(r.D)}</span><span>2 ${P(r.A)}</span></div>`;
  if(o){const inv=o.map(x=>1/x),t=inv.reduce((x,y)=>x+y,0);s+=`<div class="mu" style="margin-top:6px">Piyasanın ima ettiği: 1 ${P(inv[0]/t)} · X ${P(inv[1]/t)} · 2 ${P(inv[2]/t)}</div>`}
  s+=`<div class="mu" style="margin-top:6px">Beklenen gol: ${r.lh.toFixed(2)} – ${r.la.toFixed(2)}</div></div>`;
  s+=`<div class="c"><h3>Gol sayısı</h3>${row('1.5 Üst',r.o15,lean(r.o15))}${row('2.5 Üst',r.o25,lean(r.o25))}${row('3.5 Üst',r.o35,lean(r.o35))}${row('Karşılıklı gol var',r.bt)}</div>`;
  const fo=k=>{const v=m.htft?.[k];return v&&!isNaN(v)?` · piyasa ${v.toFixed(2)}`:''};
  const big=[['1/2','Home/Away'],['2/1','Away/Home']].map(([k,hk])=>`<div style="flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:8px"><div class="mu">İY/MS ${k}</div><b style="font-size:20px">${P(ht[k])}</b><div class="mu">adil oran ${(1/Math.max(ht[k],1e-6)).toFixed(1)}${fo(hk)}</div></div>`).join('');
  const rest=Object.entries(ht).filter(([k])=>k!='1/2'&&k!='2/1').sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<span class="mu" style="width:33%;display:inline-block;margin-top:6px">${k}: ${P(v)}</span>`).join('');
  s+=`<div class="c"><h3>İlk yarı / Maç sonucu</h3><div style="display:flex;gap:8px">${big}</div><div>${rest}</div></div>`;
  s+=`<div class="c"><h3>En olası skorlar</h3>${r.sc.map(x=>`<div class="li"><span>${x[0]}</span><b>${P(x[1])}</b></div>`).join('')}</div>`;
  s+=`<div class="c"><h3>Model güvenilirliği</h3><div class="mu">Son ${bt.N} maçta, o maçtan önceki veriyle tahmin edildi:</div><div class="li"><span>Model: maç sonucu doğru</span><b>${bt.N?P(bt.c/bt.N):'-'}</b></div><div class="li"><span>Piyasa favorisi doğru</span><b>${bt.N?P(bt.mk/bt.N):'-'}</b></div><div class="li"><span>Model: 2.5 Alt/Üst doğru</span><b>${bt.N?P(bt.o/bt.N):'-'}</b></div></div>`;
  s+='<p class="mu">Bu, geçmiş sonuçlardan öğrenen istatistiksel bir modeldir (Poisson tabanlı). Kesinlik vermez; sakatlık, kadro ve motivasyonu bilmez. Sonuçlar olasılıktır, garanti değildir.</p>';
  return s}
function tOran(f,m){const o=m.odds;if(!o||o.some(isNaN))return `<div class="c mu">${m.loading?'Yükleniyor…':'Bu maç için oran bulunamadı (oranlar genelde maçtan birkaç gün önce açılır).'}</div>`;
  const d=p=>o.reduce((s,v,i)=>s+Math.abs(p.o[i]-v)/v,0);
  const S=m.hist.filter(p=>o.every((v,i)=>Math.abs(p.o[i]-v)/v<=TOL)).sort((a,b)=>d(a)-d(b)),n=S.length,c=k=>S.filter(x=>x.r==k).length;
  const inv=o.map(x=>1/x),tot=inv.reduce((a,b)=>a+b,0);

  s+=extra(m);
  if(!m.hist.length)return s+(m.hdone?`<div class="c">Geçmiş veri dosyaları bulunamadı. GitHub’da Actions → Veri güncelle → Run workflow ile indir, 1 dakika sonra sayfayı yenile.<br><button class="bt" onclick="retryH()">Tekrar dene</button></div>`:`<div class="c mu">Geçmiş maçlar indiriliyor, bu 20-30 saniye sürebilir…</div>`);
  if(!n)return s+'<div class="c">Bu aralıkta benzer maç yok. Toleransı artır.</div>';

  return s+`<div class="c">`+S.slice(0,40).map(p=>`<div class="li"><span>${esc(p.h)} – ${esc(p.a)}<div class="mu">${p.o.map(x=>x.toFixed(2)).join(' / ')} · ${p.s.slice(0,2)}/${p.s.slice(2)}</div></span><b>${p.hg}-${p.ag}</b></div>`).join('')+'</div>'}
